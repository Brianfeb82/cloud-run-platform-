name: Deploy Production

on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA / Image tag to promote"
        required: false
        default: "latest"

jobs:
  deploy-production:
    name: Promote & Deploy to Production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build production container artifact
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: cloud-platform-api:test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.17.1"

      - name: Deploy Production via Terraform
        run: |
          cd terraform/envs/prod
          cp terraform.tfvars.example terraform.tfvars
          terraform init
          terraform apply -auto-approve -var="app_version=${{ steps.tag.outputs.image_tag }}"

      - name: Smoke Test Production Endpoint
        run: |
          echo "Waiting for production container readiness..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production smoke test passed with HTTP 200!"
              curl -s http://127.0.0.1:8080/
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: Production service did not respond with HTTP 200"
          exit 1
