<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
      .card-accent { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .card-prod { fill: #161b22; stroke: #238636; stroke-width: 2; rx: 8; }
      .card-alert { fill: #161b22; stroke: #f85149; stroke-width: 2; rx: 8; }
      .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; }
      .header { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .header-prod { fill: #3fb950; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .header-alert { fill: #f85149; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #f85149; stroke-width: 2; stroke-dasharray: 4; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f85149" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <!-- Header -->
  <text x="40" y="50" class="title">Production-Style Cloud Run Platform Architecture</text>
  <text x="40" y="75" class="subtext">GitOps Pipeline • Terraform Infrastructure • Staging &amp; Production Environments • Automated Monitoring</text>

  <!-- Step 1: Git & CI -->
  <rect x="40" y="110" width="240" height="180" class="card" />
  <text x="60" y="140" class="header">1. Code &amp; Continuous Integration</text>
  <text x="60" y="170" class="text">Push to main / Pull Request</text>
  <text x="60" y="195" class="subtext">• Unit Tests: Pytest (100% pass)</text>
  <text x="60" y="215" class="subtext">• Dockerfile Build Verification</text>
  <text x="60" y="235" class="subtext">• Terraform fmt &amp; validate check</text>
  <text x="60" y="255" class="subtext">• Immutable Tagging: Git SHA</text>

  <!-- Arrow to Staging -->
  <path d="M 280 200 L 340 200" class="arrow" />

  <!-- Step 2: Staging Deployment -->
  <rect x="350" y="110" width="250" height="180" class="card-accent" />
  <text x="370" y="140" class="header">2. Staging Deployment</text>
  <text x="370" y="170" class="text">Continuous Delivery (Automated)</text>
  <text x="370" y="195" class="subtext">• Terraform Staging Environment</text>
  <text x="370" y="215" class="subtext">• Container: platform-api-staging</text>
  <text x="370" y="235" class="subtext">• Port Mapping: 8081:8080</text>
  <text x="370" y="255" class="subtext">• Automated /health Smoke Test</text>

  <!-- Arrow to Manual Approval -->
  <path d="M 600 200 L 660 200" class="arrow" />

  <!-- Step 3: Production Promotion -->
  <rect x="670" y="110" width="250" height="180" class="card-prod" />
  <text x="690" y="140" class="header-prod">3. Production Promotion</text>
  <text x="690" y="170" class="text">Manual Approval Gate</text>
  <text x="690" y="195" class="subtext">• GitHub Environment: production</text>
  <text x="690" y="215" class="subtext">• Required Reviewer: Brianfeb82</text>
  <text x="690" y="235" class="subtext">• Promotes exact Staging image SHA</text>
  <text x="690" y="255" class="subtext">• Container: platform-api-prod (Port 8080)</text>

  <!-- Downward Arrow from Prod to Monitoring -->
  <path d="M 795 290 L 795 350" class="arrow-green" />

  <!-- Step 4: Monitoring & Alerting -->
  <rect x="520" y="360" width="400" height="140" class="card-alert" />
  <text x="540" y="390" class="header-alert">4. Monitoring, Alerting &amp; MTTR</text>
  <text x="540" y="415" class="text">Production Health Probe &amp; Drift Resolution</text>
  <text x="540" y="440" class="subtext">• 2s Interval synthetic health probe (/health)</text>
  <text x="540" y="460" class="subtext">• Automated incident detection &amp; alert trigger</text>
  <text x="540" y="480" class="subtext">• Mean Time to Recover (MTTR): 7.02 seconds verified</text>

  <!-- Left Card: Tech Stack Badges -->
  <rect x="40" y="360" width="450" height="140" class="card" />
  <text x="60" y="390" class="header">Platform Infrastructure Stack</text>
  <text x="60" y="420" class="text">Core Technologies:</text>
  <text x="60" y="445" class="subtext">• Language &amp; API: Python 3.12, FastAPI, Uvicorn</text>
  <text x="60" y="465" class="subtext">• Infrastructure as Code: Terraform v1.17, Docker Provider</text>
  <text x="60" y="485" class="subtext">• CI/CD Automation: GitHub Actions with Protected Environments</text>
</svg>
